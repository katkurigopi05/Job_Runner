pace:pre-wrap;\">People &amp; Culture:</strong></b><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\"> People are our foundation. Our teams are built on exceptional talent density — individuals who are driven, collaborative, and humble, all sharing a commitment to delivering outstanding work.</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Top-Tier Customers &amp; Global Scale:</strong></b><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\"> We work with the world's fastest-growing and most iconic brands (think Walmart, Marriott, Adobe, Sephora, Chipotle, CVS Aetna, T-Mobile, Citi, NBC / Peacock), so your work has massive reach and visibility.</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Momentum &amp; High-Impact Stage:</strong></b><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\"> We're scaling fast, but not bloated. We're big enough to matter, but small enough for you to make a significant dent with meaningful ownership.</span></li><li style=\"color:rgb(0,0,0);margin:0pt 0px;font-size:11pt;line-height:1.38;letter-spacing:0.25px;\"><b><strong style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\">Profitability &amp; Recognized Workplace:</strong></b><span style=\"color:rgb(0,0,0);font-size:11pt;white-space:pre-wrap;\"> We're committed to creating a sustainable, long-term business with a strong foundation, as well as a standout workplace (named a Best Place to Work by Fortune, Inc., Forbes, and Comparably in 2024 and 2025).</span></li></ul></body></div>", "role": "<div><body><h2 style='font-family:\"Basel Grotesk\",Arial,sans-serif;line-height:1.6;font-size:29pt;font-weight:600;letter-spacing:0.5px;margin-top:0px;margin-bottom:0px;padding-left:0px;'><span style=\"color:rgb(0,0,0);white-space:pre-wrap;\">The Role</span></h2><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:12pt 0px;padding:0px;text-align:justify;'><span style=\"color:rgb(0,0,0);font-size:12pt;white-space:pre-wrap;\">As a Technical Project Manager at Branch, you will work with the most widely known global brands to implement our mobile technology into their marketing stacks.  A successful Associate Technical Project Manager can project manage the implementation of cutting-edge mobile technology, while effectively building client relationships through strategic communications.  As part of Branch’s Professional Services organization, you’ll also have the opportunity to help shape future service offerings to meet changing market needs. If you're a driven &amp; organized project manager who is passionate about mobile technology, enjoy building relationships with internal &amp; external stakeholders, and can effectively tailor &amp; communicate Branch’s value proposition to various audiences; then you’re a great fit for this mission-critical role that is a key driver of growth for Branch.</span></p><p style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;line-height:1.38;letter-spacing:0.25px;margin:12pt 0px;padding:0px;text-align:justify;'><b><strong style=\"color:rgb(0,0,0);font-size:12pt;white-space:pre-wrap;\">Role Responsibilities: </strong></b></p><ul style='font-family:\"Basel Grotesk\",Arial,sans-serif;font-size:11pt;font-weight:400;margin:8px 0px;line-height:1.6;padding:0px 0px 0px 32px;list-style-type:disc;'><li style=\"color:rgb(0,0,0);margin:12pt 0px 0pt;font-size:12pt;line-height:1.38;--listitem-marker-color:#000000;letter-spacing:0.25px;\"><span style=\"color:rgb(0,0,0);font-size:12pt;white-space:pre-wrap;\">Project manage the implementation of Branch technology into the mobile apps and websites of
