[package]
name = "pattern-search-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `pattern_search.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
rayon = "1"
mimalloc = "0.1"
regex = "1.13"
fancy-regex = "0.20"

[profile.release]
lto = true
# macOS 27.2.1 (ld-27106): the default debuginfo strip leaves a dylib dyld refuses to load,
# "mis-aligned LINKEDIT string pool". Unstripped, it loads.
strip = false

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
