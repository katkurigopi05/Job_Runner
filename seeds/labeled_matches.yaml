  # ---- Adjacent roles -----------------------------------------------------
  # These are the discriminating half. Each shares vocabulary with the profile
  # and differs on something a person would notice — the language, the
  # seniority, the actual job. A scorer that ranks these the way the grades
  # say is doing something a keyword count is not.
  - key: adj-frontend
