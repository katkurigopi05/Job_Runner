# Relevance labels for the matching benchmark.
#
# Read seeds/labeled_matches.README before adding to this file. The short
# version: every label declares where it came from, and today every label here
# says `fixture`, which means it was written next to the code that reads it.
# CLAUDE.md §15 says why that matters. Nothing in this file is evidence about
# the owner's real feed until entries appear with `provenance: owner`.
#
# relevance scale (packages/matching/labels.py::RELEVANCE_SCALE)
#   0  irrelevant — would not apply
#   1  plausible  — would read the posting
#   2  good       — would apply
#   3  excellent  — would apply today
#
# tags
#   gate5     the twenty postings CLAUDE.md §9 Gate 5 asserts against. Do not
#             add to this tag: the gate's meaning is "10 of these 20", and
#             widening it silently changes what the gate proves.
#   adjacent  roles near the profile that a feed genuinely confuses. These are
#             what make the benchmark able to tell two scorers apart at all.

name: backend-profile-v1
version: "1"
description: >-
  One synthetic backend profile against thirty-two postings. Twenty are the
  original Gate 5 set — ten obvious matches and ten unrelated occupations.
  Twelve are adjacent roles added for the benchmark, because a set whose
  negatives are pastry chefs and truck drivers cannot separate a good ranker
  from a bad one: every scorer gets those right.

profile_text: |
  Staff Engineer, Analytical Engines Ltd
  Designed a note-taking subsystem handling millions of events per day in Python.
  Migrated the billing service from MySQL to PostgreSQL with zero downtime.
  Built async APIs with FastAPI, deployed on Kubernetes and Docker.
  Skills: Python, PostgreSQL, FastAPI, Docker, Kubernetes, async, backend, distributed systems

