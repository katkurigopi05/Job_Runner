# Hand-picked company registry — CLAUDE.md §9, Phase 5.
#
# Not a mass crawl. `slug` is the company's identifier on its ATS board, which
# is what the extractor requests.
#
# poll_interval_s is per company and is only ever an *upper* bound on
# frequency: the 60s per-host floor in packages/crawler/ratelimit.py applies
# regardless of what is written here.
#
# Every entry below was verified live on 2026-08-17 with `make validate-seeds`:
# the board API answered 200 and returned a job list.
#
# 21 companies were removed in that pass. They are listed at the
# bottom with the evidence rather than deleted outright, so nobody re-adds them
# from memory. A 404 board is worse than an absent one: it yields zero postings,
# which reads identically to "nothing new since the last poll", so discovery
# silently covered a fraction of the registry it claimed to.

companies:
  - name: "Stripe"
    slug: "stripe"
    ats: "greenhouse"
    poll_interval_s: 21600

