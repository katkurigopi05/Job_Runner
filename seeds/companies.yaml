# Hand-picked company registry — CLAUDE.md §9, Phase 5.
#
# Roughly 50 companies, not a mass crawl. `slug` is the company's
# identifier on its ATS board, which is what the extractor requests.
#
# poll_interval_s is per company and is only ever an *upper* bound on
# frequency: the 60s per-host floor in packages/crawler/ratelimit.py
# applies regardless of what is written here.

companies:
