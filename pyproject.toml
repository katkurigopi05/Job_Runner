[project]
name = "jobrunner"
version = "0.1.0"
description = "Local, single-user job-application agent."
requires-python = ">=3.12"

# Phase 0 only. Playwright, sentence-transformers, WeasyPrint et al. arrive
# with the phase that needs them. No paid service belongs in here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Never imported directly — FastAPI reaches for it at runtime to parse the
    # multipart body on the résumé upload route.
    "python-multipart>=0.0.9",
    # [email] — packages/core/schemas.py validates candidate addresses with
    # EmailStr, which imports email-validator lazily at first use.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "cryptography>=43.0",
    "structlog>=24.4",
    "httpx>=0.27",
    # Pinned to a minor: the wheel and the browser build ship together,
    # and a mismatch means Playwright tries to re-download Chromium.
    "playwright>=1.56,<1.57",
    "weasyprint>=62",
    "pypdf>=5",
    # Résumés arrive as .docx as often as .pdf — packages/tailor/parse.py.
    "python-docx>=1.1",
    # apps/mcp/server.py imports this at module scope.
    "mcp>=1.2",
    # packages/crawler/extract.py reads the company seed list.
    "pyyaml>=6",
    # packages/tailor/chunk.py — noun-phrase extraction for the fabrication
    # guard. Not optional: without it §9 Gate 3 checks capitalization instead
    # of noun phrases, and a lowercase claim like "machine learning" is
    # invisible. The tagger *data* is a separate download — `make nltk-data`.
    "nltk>=3.9",
]

[project.optional-dependencies]
# Real embeddings. Optional on purpose: this pulls torch, and
# packages/matching/embed.py already falls back to lexical scoring and logs
# `sentence_transformers_unavailable_using_lexical` when it is absent. Install
# with `pip install -e ".[embeddings]"` when you want the real vectors.
embeddings = ["sentence-transformers>=3"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # PyYAML ships no inline types; without the stubs mypy fails the gate.
    "types-PyYAML>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Reference docs are quoted verbatim — the formatter must not rewrite the code
# blocks inside them.
#
# `scripts/adhoc/` is one-off analysis written in a parallel agent session:
# hardcoded ids, absolute paths into another tool's directory, read-once input
# files. It is kept because it records what was actually run, and excluded
# because linting it means rewriting somebody's scratch work to satisfy rules
# it was never written against. Project tooling lives in `scripts/` proper and
# is linted normally.
extend-exclude = ["docs", "*.md", "scripts/adhoc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests share one loop, so the session-scoped engine and the
# per-test connection are not bound to different loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

# strict on core and ats, per CLAUDE.md §3
[[tool.mypy.overrides]]
module = ["packages.core.*", "packages.ats.*"]
strict = true

# weasyprint ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["weasyprint.*", "pypdf.*", "sentence_transformers.*", "nltk.*"]
ignore_missing_imports = true
