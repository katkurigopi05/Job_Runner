# Version updates for what Dependabot can update safely here. Weekly, grouped,
# so a week brings at most one pull request per group.
#
# Python is left out on purpose. constraints.txt is a full resolution written
# by `uv pip compile` (`make lock`); Dependabot would edit single lines of it
# without re-resolving, and tests/test_dependencies_are_locked.py exists
# because a lock that disagrees with itself goes unnoticed. The weekly
# `audit` job in ci.yml watches the Python pins for advisories instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Minor and patch releases only. A major release of Next, React, ESLint or
  # TypeScript is a migration, taken on purpose in a change of its own.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
