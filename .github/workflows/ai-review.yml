name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The pin below only holds with this set. The `ocr` launcher updates
      # itself: its first run (the action's own version check) starts a
      # background `npm i -g` of the latest release, which replaces the package
      # while the review step is starting. Every run since 1.12.8 was published
      # on 2026-09-21 died with "Cannot find module '../scripts/platform'" or
      # "Cannot find module '/usr/local/bin/ocr'", depending on how far npm had
      # got. Job level, so the action's composite steps inherit it.
      OCR_NO_UPDATE: '1'

    steps:
      # Advisory, so its failure must not turn a pull request red. It depends
      # on a free model route OpenRouter can withdraw without notice and a
      # daily free quota other projects share, and from 2026-09-21 it failed
      # every PR for reasons that had nothing to do with the PR. The next step
      # says so loudly instead, as a warning and in the job summary, so a
      # reviewer that stopped working does not look like one that found nothing.
      - name: Review pull request
        id: review
        continue-on-error: true
        uses: alibaba/open-code-review@7a571b78d3493b249f6ad14d835c6a79a0a67d2e # v1.12.6
        with:
          ocr_version: '1.12.6'
          llm_url: https://openrouter.ai/api/v1
          llm_auth_token: ${{ secrets.OPENROUTER_API_KEY }}
          # Free routes are withdrawn without notice:
          # deepseek/deepseek-v4-flash-0731:free was gone by 2026-09-30, and
          # OpenRouter then listed no free DeepSeek model at all. The model must
          # support tool calls, since each review unit runs as an agent. Set the
          # AI_REVIEW_MODEL repository variable to switch without a commit.
          llm_model: ${{ vars.AI_REVIEW_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          effort: low
          review_concurrency: '1'
          stream_progress: 'true'
          sticky_summary: 'true'
          incremental: 'true'

      - name: Report a review that did not run
        if: steps.review.outcome == 'failure'
        env:
          MODEL: ${{ vars.AI_REVIEW_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
        run: |
          echo "::warning title=AI review did not run::The reviewer failed, so this PR has had no AI review. Common causes: the free model ($MODEL) was withdrawn, the OpenRouter daily quota is spent, or the tool broke. See the 'Review pull request' step log."
          {
            echo "### AI review did not run"
            echo
            echo "This PR has **not** been reviewed. The check is green because the reviewer is advisory, not because it found nothing."
            echo
            echo "- Model: \`$MODEL\`. Set the \`AI_REVIEW_MODEL\` repository variable to switch."
            echo "- Details: the *Review pull request* step log, and the \`ocr-review-result-*\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
